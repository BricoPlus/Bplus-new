<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c62828"><meta http-equiv="Cache-Control" content="no-store"><title>B+ Gestionale HR – Accesso</title><style>*{box-sizing:border-box}html,body{height:100%;margin:0;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:flex;align-items:center;justify-content:center;padding:20px;min-height:100vh}.card{width:min(390px,100%)}.logo{text-align:center;margin-bottom:24px}.simple-logo{display:flex;align-items:center;justify-content:center;width:120px;height:120px;margin:0 auto 14px;background:#e30613;color:#ffe900;border-radius:12px;font-size:54px;font-weight:900;line-height:1;letter-spacing:-5px;font-style:normal}.logo h1{color:#fff;font-size:22px;margin:0;font-weight:800}.logo p{color:#777;font-size:13px;margin:5px 0 0}.form{background:#1e1e1e;border:1px solid #2b2b2b;border-radius:16px;padding:22px}label{display:block;color:#999;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:0 0 6px}input{width:100%;padding:14px;background:#292929;border:1px solid #3b3b3b;border-radius:10px;color:#fff;font-size:16px;outline:0;margin:0 0 16px}input:focus{border-color:#c62828}.btn{width:100%;min-height:50px;border:0;border-radius:10px;background:#c62828;color:#fff;font-size:16px;font-weight:700;cursor:pointer}.btn:disabled{opacity:.6}.err{display:none;color:#ef9a9a;background:#300909;border-radius:8px;padding:10px;margin-top:12px;font-size:13px;text-align:center}.hint{color:#777;font-size:12px;text-align:center;line-height:1.45;margin-top:12px}.footer{text-align:center;color:#444;font-size:11px;margin-top:18px}</style></head><body><div class="card"><div class="logo"><div class="simple-logo" aria-label="B+">B+</div><h1>B+ Gestionale HR</h1><p>La Quattro S.r.l.</p></div><div class="form"><label for="em">Email</label><input id="em" type="email" autocomplete="username" inputmode="email" placeholder="Email"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Password"><button id="loginBtn" class="btn" type="button">Accedi</button><div id="err" class="err"></div><div class="hint">Accesso aziendale protetto · sincronizzazione online</div></div><div class="footer">B+ Gestionale · La Quattro S.r.l.</div></div><script src="./auth-v3.js?build=20261002-login-v3"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./auth-v3.js?build=20261002-login-v3"></script><script src="./cloud-v1.js?build=20261011-cloud1"></script><script>(function(){const em=document.getElementById('em'),pw=document.getElementById('pw'),btn=document.getElementById('loginBtn'),err=document.getElementById('err');function show(t){err.textContent=t;err.style.display='block'}async function login(){err.style.display='none';const e=em.value.trim().toLowerCase(),p=pw.value;if(!e||!p){show('Inserisci email e password');return}btn.disabled=true;btn.textContent='Verifica accesso…';try{await BPlusCloud.signIn(e,p);location.replace('./app.html?login=cloud');return}catch(cloudError){const local=BPlusAuth.authenticate(e,p);if(local.ok&&confirm('Accesso online non riuscito ('+(cloudError.message||'errore di accesso')+'). Vuoi continuare in modalità locale? Le modifiche non saranno sincronizzate con gli altri dispositivi.')){localStorage.removeItem('bplus_cloud_required');BPlusAuth.set(local.user,local.forcePassword);location.replace(local.forcePassword?'./change-password-v2.html?first=1':'./app.html?login=local');return}btn.disabled=false;btn.textContent='Accedi';show(cloudError.message||'Accesso online non riuscito. Verifica email e password.')}}btn.addEventListener('click',login);pw.addEventListener('keydown',e=>{if(e.key==='Enter')login()});const a=BPlusAuth.get();if(a)location.replace('./app.html?login=existing');else BPlusCloud.currentProfile().then(profile=>{if(profile)location.replace('./app.html?login=cloud-existing')}).catch(()=>{})})();</script></body></html>
