const P={dashboard:'Dashboard',employees:'Dipendenti',shifts:'Turni',history:'Storico turni',calendar:'Calendario HR',absences:'Ferie & Permessi',stores:'Punti vendita',courses:'Corsi',board:'Bacheca',reports:'Report',notifications:'Notifiche',audit:'Audit log',backup:'Backup & Sincronizzazione',profile:'Profilo'};function allowed(p){if(user.ruolo===3)return true;if(user.ruolo===2)return ['dashboard','employees','shifts','history','calendar','absences','board','notifications','profile'].includes(p);return ['dashboard','calendar','absences','courses','board','notifications','profile'].includes(p)}function go(p){if(!allowed(p))return;page=p;side.classList.remove('open');title.textContent=P[p];buildNav();render()}
function buildNav(){nav.innerHTML=Object.entries(P).filter(([p])=>allowed(p)).map(([p,n])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${n}</button>`).join('');bottom.innerHTML=[['dashboard','⌂'],['calendar','📅'],['notifications','🔔'],['menu','☰']].map(([p,i])=>`<button onclick="${p==='menu'?'toggleMenu()':`go('${p}')`}"><b>${i}</b>${p==='menu'?'Menu':P[p]}</button>`).join('');who.innerHTML=`<b>${esc(user.nome||'Utente')} ${esc(user.cognome||'')}</b><div class="muted">${roles[user.ruolo]||''}${user.negozio?' · '+esc(user.negozio):''}</div>`}

function employees(){if(user.ruolo!==3&&!(user.ruolo===2&&window.BPlusCloud&&BPlusCloud.isReady()))return '<div class="card">Accesso non disponibile.</div>';return `<div class="actions"><button class="btn" onclick="employeeModal()">+ Nuovo lavoratore</button></div><div class="section tablewrap"><table class="table"><tr><th>Nome</th><th>Email</th><th>Ruolo</th><th>Negozio</th><th>Stato</th><th></th></tr>${db.employees.map(e=>`<tr><td>${esc(e.nome)} ${esc(e.cognome)}</td><td>${esc(e.email)}</td><td>${roles[e.ruolo]}</td><td>${esc(e.negozio)}</td><td>${esc(e.stato)}</td><td><div class="sp-actions"><button class="btn secondary" onclick="employeeModal(${e.id})">Apri</button>${user.ruolo===3&&[1,2].includes(e.ruolo)?`<button class="btn secondary" onclick="inviteEmployeeAccount(${e.id})" ${e.email?'':'disabled'}>Invia invito</button>`:''}<button class="btn danger" onclick="deleteEmployee(${e.id})" title="Elimina lavoratore e dati collegati">Elimina</button></div></td></tr>`).join('')}</table></div>`}
async function inviteEmployeeAccount(id){if(user.ruolo!==3)return;const e=db.employees.find(x=>String(x.id)===String(id));if(!e)return;if(!e.email||!String(e.email).includes('@')||String(e.email).endsWith('@no-email.invalid')){alert('Inserisci prima un indirizzo email valido nella scheda dipendente.');return}if(!confirm('Inviare un invito di accesso online a '+e.email+'? Il destinatario riceverà un messaggio email.'))return;try{const r=await BPlusCloud.inviteEmployee(id);alert(r.message+(r.invited?' · Apri il link ricevuto via email per attivare l’accesso.':' · Accesso associato all’account esistente.'))}catch(err){alert('Invito non riuscito: '+(err.message||'errore imprevisto'))}}
function deleteEmployee(id){if(user.ruolo!==3&&!(user.ruolo===2&&window.BPlusCloud&&BPlusCloud.isReady()))return;const e=db.employees.find(x=>String(x.id)===String(id));if(!e)return;if(user.ruolo===2&&e.negozio!==user.negozio)return;if(String(e.id)===String(user.id)){alert('Non puoi eliminare il tuo stesso account.');return}const nome=(e.nome+' '+e.cognome).trim()||e.email||'questo lavoratore';if(!confirm('Eliminare definitivamente '+nome+'?\n\nVerranno eliminati anche turni, assenze, corsi, presenze e notifiche collegati al lavoratore.'))return;const idv=String(id);db.employees=db.employees.filter(x=>String(x.id)!==idv);db.shifts=db.shifts.filter(x=>String(x.emp)!==idv);db.absences=db.absences.filter(x=>String(x.emp)!==idv);db.courses=db.courses.filter(x=>String(x.emp)!==idv);db.attendance=db.attendance.filter(x=>String(x.emp)!==idv);db.notifications=db.notifications.filter(x=>String(x.emp)!==idv);save();render()}
function employeeModal(id){if(user.ruolo!==3&&!(user.ruolo===2&&window.BPlusCloud&&BPlusCloud.isReady()))return;let e=id?db.employees.find(x=>x.id==id):{id:Date.now(),nome:'',cognome:'',email:'',telefono:'',ruolo:1,negozio:user.ruolo===2?user.negozio:'GAG',stato:'attivo',inTurni:true,contratto:'indeterminato',ore:40,capacitaGenerale:3,policyDomeniche:'ogni2',pausaTipo:'flessibile',pausaInizio:'12:00',pausaFine:'13:30',pausaMin:60,riposiFissi:[],compensativi:[],mobilita:[]};window._emp=e;openModal('Scheda lavoratore',`<div class="tabs"><button class="active" onclick="empTab('an')">Anagrafica</button><button onclick="empTab('ct')">Contratto & Turni</button><button onclick="empTab('as')">Assenze</button></div><div id="etab"></div>`);empTab('an')}
function shiftHoursValue(s){if(!s||s.type!=='Turno'||!s.in||!s.out)return 0;const m=t=>{const q=String(t).split(':').map(Number);return q[0]*60+q[1]};let total=Math.max(0,m(s.out)-m(s.in));if(s.breakStart&&s.breakEnd)total-=Math.max(0,m(s.breakEnd)-m(s.breakStart));return Math.max(0,total)/60}

  if(!e)return 0;

function saveCourse(){let c=window._course;c.emp=coEmp.value;c.titolo=coTitle.value.trim();c.categoria=coCat.value;c.ente=coProvider.value.trim();c.data=coDate.value;c.scadenza=coExpiry.value;c.durata=+coHours.value||0;c.stato=coStatus.value;c.attestato=coCert.value.trim();c.note=coNotes.value.trim();if(!c.emp||!c.titolo){alert('Seleziona il lavoratore e inserisci il titolo del corso.');return}let i=db.courses.findIndex(x=>String(x.id)===String(c.id));if(i<0)db.courses.push(c);else db.courses[i]=c;save();closeModal();render()}
function deleteCourse(){if(!confirm('Eliminare definitivamente questo corso?'))return;db.courses=db.courses.filter(x=>String(x.id)!==String(window._course.id));save();closeModal();render()}

function attendance(){const mine=user.ruolo===1;let list=db.attendance.filter(a=>!mine||String(a.emp)===String(user.id));const todayRec=list.find(a=>a.date===todayDate()&&String(a.emp)===String(user.id));return '<div class="grid"><div class="card"><div class="muted">Oggi</div><div class="stat">'+todayDate()+'</div><p>'+(!todayRec?'Nessuna entrata registrata':('Entrata <b>'+todayRec.in+'</b><br>Uscita <b>'+(todayRec.out||'—')+'</b><br>Pausa <b>'+(todayRec.breakMin||0)+' min</b>'))+'</p><div class="actions">'+(!todayRec?'<button class="btn green" onclick="clockIn()">▶ Entrata</button>':(!todayRec.out?'<button class="btn" onclick="clockOut()">■ Uscita</button><button class="btn secondary" onclick="addBreak()">☕ Pausa</button>':''))+'</div></div><div class="card"><div class="muted">Ore lavorate oggi</div><div class="stat">'+workedHours(todayRec)+'</div><p class="muted">Calcolo basato sulle timbrature.</p></div></div><div class="section tablewrap"><table class="table"><tr><th>Data</th><th>Lavoratore</th><th>Negozio</th><th>Entrata</th><th>Uscita</th><th>Pausa</th><th>Ore</th><th>Stato</th></tr>'+list.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,100).map(a=>'<tr><td>'+a.date+'</td><td>'+esc(empName(a.emp))+'</td><td>'+esc(a.store||'')+'</td><td>'+a.in+'</td><td>'+(a.out||'—')+'</td><td>'+(a.breakMin||0)+'</td><td>'+workedHours(a)+'</td><td>'+(a.out?'completa':'aperta')+'</td></tr>').join('')+'</table></div>'}
function workedHours(a){if(!a||!a.in)return '0:00';const end=a.out||new Date().toTimeString().slice(0,5);const m=(x)=>{const q=x.split(':');return +q[0]*60 + +q[1]};let n=Math.max(0,m(end)-m(a.in)-(a.breakMin||0));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}
function clockIn(){let ex=db.attendance.find(a=>a.date===todayDate()&&String(a.emp)===String(user.id));if(ex){alert('Entrata già registrata.');return}db.attendance.push({id:Date.now(),emp:user.id,date:todayDate(),in:new Date().toTimeString().slice(0,5),out:'',breakMin:0,store:user.negozio||'',status:'aperta'});audit('Presenza','Entrata '+todayDate());save();render()}
function clockOut(){let a=db.attendance.find(x=>x.date===todayDate()&&String(x.emp)===String(user.id));if(!a){alert('Registra prima l’entrata.');return}a.out=new Date().toTimeString().slice(0,5);a.status='completa';audit('Presenza','Uscita '+todayDate());save();render()}
function addBreak(){let a=db.attendance.find(x=>x.date===todayDate()&&String(x.emp)===String(user.id));if(!a||a.out){alert('Nessuna presenza aperta.');return}const n=prompt('Minuti di pausa da aggiungere','30');if(n&&+n>0){a.breakMin=(a.breakMin||0)+(+n);audit('Presenza','Pausa '+n+' minuti');save();render()}}
function shiftWeekKey(date){const d=new Date(date+'T12:00:00');const day=d.getDay()||7;d.setDate(d.getDate()-day+1);return d.toISOString().slice(0,10)}
function shiftWeekDates(week){const d=new Date(week+'T12:00:00');return Array.from({length:7},(_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return x.toISOString().slice(0,10)})}
function weekLabel(week){const ds=shiftWeekDates(week);return ds[0].slice(8,10)+'/'+ds[0].slice(5,7)+' – '+ds[6].slice(8,10)+'/'+ds[6].slice(5,7)}
function shiftStores(){return STORES.map(s=>s[0])}
function weekStoreState(week,store){if(!db.shiftWeeks||typeof db.shiftWeeks!=='object')db.shiftWeeks={};if(!db.shiftWeeks[week]||typeof db.shiftWeeks[week]!=='object')db.shiftWeeks[week]={};if(!db.shiftWeeks[week][store])db.shiftWeeks[week][store]={status:'bozza'};return db.shiftWeeks[week][store]}
function weekStoreStatus(week,store){return weekStoreState(week,store).status||'bozza'}
function allStoresDirectorApproved(week){return shiftStores().every(s=>['approvata_direttore','inviato_titolare','approvata_titolare'].includes(weekStoreStatus(week,s)))}
function allStoresOwnerApproved(week){return shiftStores().every(s=>weekStoreStatus(week,s)==='approvata_titolare')}function approvedWeekHistory(week,store,limit=12){const out=[];const d=new Date(week+'T12:00:00');for(let i=1;i<=26&&out.length<limit;i++){d.setDate(d.getDate()-7);const w=d.toISOString().slice(0,10);if(weekStoreStatus(w,store)==='approvata_titolare')out.push(w)}return out}
function continuityProfile(emp,store,week){const history=approvedWeekHistory(week,store,12);const profile={weekdays:new Set(),starts:new Map(),partners:new Map(),partnerDays:new Map()};for(const w of history){const ds=shiftWeekDates(w);for(const s of db.shifts.filter(x=>x.store===store&&ds.includes(x.date)&&String(x.emp)===String(emp.id)&&x.type==='Turno')){const wd=new Date(s.date+'T12:00:00').getDay();profile.weekdays.add(wd);if(s.in)profile.starts.set(wd,s.in)}for(const d of ds){const mine=db.shifts.filter(x=>x.store===store&&x.date===d&&x.type==='Turno'&&String(x.emp)===String(emp.id));if(!mine.length)continue;for(const s of db.shifts.filter(x=>x.store===store&&x.date===d&&x.type==='Turno'&&String(x.emp)!==String(emp.id))){profile.partners.set(String(s.emp),(profile.partners.get(String(s.emp))||0)+1);const wd=new Date(d+'T12:00:00').getDay();profile.partnerDays.set(wd,(profile.partnerDays.get(wd)||0)+1)}}}return{history,profile}}

function approvedAbsence(emp,date){return db.absences.some(a=>String(a.emp)===String(emp)&&a.stato==='approvato'&&date>=a.da&&date<=a.a)}
function sundayPolicy(emp){return emp.policyDomeniche||'ogni2'}
function isSunday(date){return new Date(date+'T12:00:00').getDay()===0}
function sundayShiftExists(emp,date){return db.shifts.some(s=>String(s.emp)===String(emp)&&s.date===date&&s.type==='Turno')}
function sundayDatesAround(date){const d=new Date(date+'T12:00:00');const out=[];for(let i=-12;i<=12;i++){const x=new Date(d);x.setDate(d.getDate()+i*7);out.push(x.toISOString().slice(0,10))}return out}
function sundayCanWork(emp,date){
  if(!isSunday(date))return true;
  const policy=sundayPolicy(emp);
  if(policy==='tutte')return true;
  if(policy==='nessuna')return false;
  const d=new Date(date+'T12:00:00');
  if(policy==='ogni3'){
    const prev=new Date(d);prev.setDate(d.getDate()-14);
    const p=prev.toISOString().slice(0,10);
    return !sundayShiftExists(emp,p);
  }
  // 1 ogni 2 = alternanza normale. Se per un'eccezione il lavoratore
  // ha già lavorato due domeniche consecutive, le due domeniche successive
  // diventano di riposo: W-W-O-O-W, poi si riprende l'alternanza.
  const sundays=[];
  for(let i=1;i<=12;i++){
    const x=new Date(d);
    x.setDate(d.getDate()-7*i);
    sundays.push(x.toISOString().slice(0,10));
  }
  const worked=i=>sundayShiftExists(emp,sundays[i-1]);

  // Due domeniche consecutive già lavorate => questa è la prima delle
  // due domeniche di recupero obbligatorie.
  if(worked(1)&&worked(2))return false;

  // Se le due domeniche precedenti sono state di riposo e le due ancora
  // precedenti sono state lavorate, questa è la ripresa dopo il recupero.
  if(!worked(1)&&!worked(2)&&worked(3)&&worked(4))return true;

  // Alternanza ordinaria: lavoro/riposo/lavoro/riposo.
  const lastWorkedIndex=sundays.findIndex(x=>sundayShiftExists(emp,x));
  if(lastWorkedIndex<0)return true;
  return lastWorkedIndex%2===1;
}
function courseOnDate(emp,date){return db.courses.find(c=>String(c.emp)===String(emp)&&c.data===date&&(c.stato==='programmato'||c.stato==='in corso'||c.stato==='completato'))||null}
function storeDay(store,date){const s=db.stores.find(x=>x.id===store);if(!s)return null;const d=new Date(date+'T12:00:00').getDay();return (s.exceptions&&s.exceptions[date])||((s.days&&s.days['weekly-'+d])||null)}
function addMinutesToTime(t,min){const q=t.split(':').map(Number);let n=q[0]*60+q[1]+min;return String(Math.floor((n+1440)%1440/60)).padStart(2,'0')+':'+String((n+1440)%60).padStart(2,'0')}
function timeMin(t){const q=String(t||'00:00').split(':').map(Number);return (q[0]||0)*60+(q[1]||0)}
function timeStr(n){n=Math.max(0,Math.round(n));return String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function contractPause(e,h){
  if(e&&e.pausaTipo==='fissa'){
    const a=timeMin(e.pausaInizio||'12:00'),b=timeMin(e.pausaFine||'13:30');
    if(b>a)return {minutes:b-a,start:a,end:b};
  }
  const mins=Math.max(0,Number(e?.pausaMin)||0);
  if(mins>0)return {minutes:mins,start:timeMin(h?.lunch1||'12:30'),end:timeMin(h?.lunch1||'12:30')+mins};
  return {minutes:0,start:0,end:0};
}
const GAGGIOLO_HISTORY_SEED={"alessio":[["08:30","12:00","13:30","19:30",144],["08:30","12:00","13:30","19:00",22],["08:30","12:00","13:30","18:00",16]],"roberto db":[["08:30","12:30","13:30","19:30",37],["08:30","12:30","13:30","18:00",18],["08:30","13:00","14:00","19:30",14]],"andrea":[["09:30","14:00","15:00","19:30",50],["08:30","14:00","15:00","19:30",38],["08:30","14:00","15:00","19:00",11]],"mattia":[["08:30","14:00","15:00","19:30",22],["08:30","11:30","13:30","19:30",16],["08:30","13:00","14:00","19:30",14]],"manuel":[["09:00","13:00","14:00","19:30",15],["08:30","13:00","14:00","19:30",15],["08:30","13:30","14:30","19:30",7]],"allan":[["10:00","13:30","14:30","19:30",6],["08:30","13:00","14:00","19:30",5],["08:30","13:30","14:30","19:30",4]],"pietro":[["08:30","12:30","13:30","19:30",15],["08:30","12:30","13:30","19:00",7],["09:30","12:30","13:30","19:30",6]],"beretta m":[["09:30","13:00","14:00","19:30",10],["09:30","12:30","13:30","19:30",3],["09:00","13:00","14:00","19:30",3]],"alfio":[["08:30","13:00","14:00","18:30",4],["08:30","13:30","14:30","18:30",3],["07:00","12:30","13:30","18:00",1]],"massimo":[["08:30","13:00","14:00","19:00",7],["09:00","12:30","13:30","19:00",3],["09:00","13:30","14:30","19:00",3]]};
function historicalNameKeys(e){return [...new Set([e&&e.nome,e&&e.cognome,e&&(e.nome+' '+e.cognome),e&&(e.cognome+' '+e.nome)].filter(Boolean).map(x=>String(x).trim().toLowerCase()))]}

function historicalFitScore(e,store,date,kind){const h=storeDay(store,date),a=historicalCandidates(e,store,shiftWeekKey(date));if(!h||!a.length)return 0;const open=timeMin(h.open||'08:30'),close=timeMin(h.close||'19:30');let best=20;for(const x of a){const p=x.p;if(!p[0]||!p[3])continue;let s=Math.abs(timeMin(p[0])-open)/30*.35+Math.abs(timeMin(p[3])-close)/30*.25;if(kind==='open'&&p[0]===h.open)s-=7;if(kind==='close'&&p[3]===h.close)s-=7;s-=Math.min(4,Math.log10((x.weight||1)+1)*1.5);best=Math.min(best,s)}return Math.max(-8,best)}

function excelNorm(v){return String(v==null?'':v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}

function excelEmployee(v){

function excelBuildPlan(rows,fileName,weekNo){

  let headerRow=-1,dayCols=new Array(7).fill(null);
  for(let r=0;r<Math.min(rows.length,15);r++){
    const row=rows[r]||[];
    for(let c=0;c<row.length;c++){
      const d=excelDayFromHeader(row[c]);
      if(d>=0&&dayCols[d]===null)dayCols[d]=c;
    }
    if(dayCols.filter(x=>x!==null).length>=4){headerRow=r;break}

  const firstDay=dayCols.findIndex(x=>x!==null);

  let currentStore='';

      const e=excelEmployee(raw);

    }

  };

    if(!text.length)continue;
    const rowStore=text.map(excelStore).find(Boolean);
    const workers=workerColumns(row);
    if(rowStore&&!workers.some(x=>x.e)){currentStore=rowStore;continue}
    if(!workers.length)continue;
    const w=workers[0];
    if(!w.e){
      unmatched.push('Riga '+(r+1)+': '+w.raw);
      diag.push('Riga '+(r+1)+' lavoratore non trovato: '+w.raw);
      continue;
    }
    if(workers.length>1){
      ambiguous.push('Riga '+(r+1)+': '+workers.map(x=>x.raw).join(' / '));
      diag.push('Riga '+(r+1)+' contiene più possibili lavoratori: '+workers.map(x=>x.raw).join(' / '));
      continue;

      const explicitStore=excelStore(meaning);
      if(explicitStore){store=explicitStore;type='Turno'}
      if(!store){warnings.push('Riga '+(r+1)+' '+e.nome+' '+e.cognome+' '+dates[d]+': negozio non determinato');continue}
      const key=String(e.id)+'|'+dates[d];
      if(seen.has(key)){
        const old=seen.get(key);
        if(old.store!==store){old.blocked='doppio-negozio';warnings.push(e.nome+' '+e.cognome+' '+dates[d]+': due negozi')}
        continue;
      }
      let blocked='';
      if(!eligibleForStore(e,store)){blocked='mobilita';unauthorized.push(e.nome+' '+e.cognome+' · '+dates[d]+' → '+storeNameOf(store))}
      const h=storeDay(store,dates[d]);if(h&&h.closed){blocked=blocked||'chiuso';closed.push(storeNameOf(store)+' · '+dates[d]+' · '+e.nome+' '+e.cognome)}

      records.push(rec);seen.set(key,rec);rowRecords++;
    }
    if(!rowRecords)diag.push('Riga '+(r+1)+' '+e.nome+' '+e.cognome+': nessuna presenza riconosciuta nelle 28 celle');
  }

    throw new Error('Nessuna presenza riconosciuta. '+(diag.slice(0,8).join(' | ')||'Controlla che il foglio usi 7 giorni con 4 colonne M/M/P/P per giorno.'));

function readExcelWeek(input){
  const file=input&&input.files&&input.files[0];if(!file)return;
  if(typeof XLSX==='undefined'){alert('Lettore Excel non disponibile.');return}
  const n=prompt('Numero settimana (1–53):');
  if(n===null)return;
  if(!/^(?:[1-9]|[1-4][0-9]|5[0-3])$/.test(String(n).trim())){alert('Numero settimana non valido.');input.value='';return}
  file.arrayBuffer().then(buf=>{
    try{
      const book=XLSX.read(buf,{type:'array',cellDates:false,raw:false});
      let best=null;
      for(const name of book.SheetNames){
        const rows=XLSX.utils.sheet_to_json(book.Sheets[name],{header:1,defval:'',raw:false});
        if(!rows.length)continue;
        try{
          const p=excelBuildPlan(rows,file.name+' · '+name,n);
          if(!best||p.records.length>best.records.length)best=p;
        }catch(e){}
      }
      if(!best)throw new Error('Nessun turno riconosciuto nei fogli del file.');
      window._excelImportPlan=best;
      renderExcelImportPreview(best);
    }catch(e){window._excelImportPlan=null;alert('Import Excel non riuscito: '+String(e&&e.message||e))}
  }).catch(e=>alert('Impossibile leggere il file Excel: '+String(e&&e.message||e)));
}

function autoGeneratePresence(){
  const week=shiftWeekKey(document.getElementById('genWeek')?.value||todayDate()),only=document.getElementById('genStore')?.value,stores=only?[only]:shiftStores(),dates=shiftWeekDates(week);
  const workers=db.employees.filter(e=>e.stato==='attivo'&&e.inTurni!==false).sort((a,b)=>(a.cognome+' '+a.nome).localeCompare(b.cognome+' '+b.nome,'it'));
  const coverage={},chosen={},skipped={rest:0,absence:0,closed:0,sunday:0,comp:0};
  dates.forEach(d=>stores.forEach(s=>coverage[s+'|'+d]=0));
  const dayNo=date=>{const j=new Date(date+'T12:00:00').getDay();return j===0?6:j-1};
  const isBlocked=(e,date)=>{
    const d=dayNo(date);
    if((e.riposiFissi||[]).includes(String(d)))return 'rest';
    if(approvedAbsence(e.id,date))return 'absence';
    if(d===6&&!sundayCanWork(e,date))return 'sunday';
    return '';
  };
  const openStores=(e,date)=>{
    return stores.filter(s=>eligibleForStore(e,s)).filter(s=>{const h=storeDay(s,date);return h&&!h.closed;});
  };
  const pickStore=(e,date)=>{
    const candidates=openStores(e,date);
    if(!candidates.length)return null;
    const base=candidates.find(s=>s===e.negozio);
    if(base)return base;
    return candidates.slice().sort((a,b)=>(coverage[a+'|'+date]||0)-(coverage[b+'|'+date]||0))[0];
  };
  const setPresence=(e,date,store)=>{
    const el=document.getElementById('pr_'+e.id+'_'+date);
    if(!el||!store)return false;
    el.value=store;
    coverage[store+'|'+date]=(coverage[store+'|'+date]||0)+1;
    chosen[String(e.id)+':'+date]=store;
    return true;
  };
  for(const e of workers){
    const targetDays=Math.min(6,Math.max(1,Math.ceil((Number(e.ore)||40)/8)));
    const fixed=new Set((e.riposiFissi||[]).map(String));
    const candidates=[];
    for(const date of dates){
      const blocked=isBlocked(e,date);
      if(blocked){skipped[blocked]++;continue}
      const store=pickStore(e,date);
      if(!store){skipped.closed++;continue}
      const d=dayNo(date);
      candidates.push({date,store,d,sunday:d===6});
    }
    const weekdays=candidates.filter(x=>!x.sunday);
    const sunday=candidates.find(x=>x.sunday);
    const selected=[];
    const compOptions=(e.compensativi||[]).map(String).filter(x=>!fixed.has(x)).map(Number).filter(n=>n>=0&&n<=5);
    const chooseCompDay=()=>{
      const possible=weekdays.filter(x=>compOptions.includes(x.d)&&!selected.some(y=>y.date===x.date));
      return possible.sort((a,b)=>a.d-b.d)[0]||null;
    };
    let compDay=null;
    // La domenica entra automaticamente solo se serve per raggiungere i giorni
    // contrattuali; se viene scelta, un eventuale riposo compensativo viene riservato.
    if(targetDays>weekdays.length&&sunday){
      compDay=chooseCompDay();
      if(compDay)skipped.comp++;
      const pool=weekdays.filter(x=>!compDay||x.date!==compDay.date);
      selected.push(...pool.slice(0,Math.max(0,targetDays-1)));
      if(selected.length<targetDays)selected.push(sunday);
    }else{
      // Per i contratti fino a 40h si privilegiano i giorni feriali; la domenica
      // viene usata se non ci sono abbastanza giorni lavorabili.
      selected.push(...weekdays.slice(0,targetDays));
      if(selected.length<targetDays&&sunday){
        compDay=chooseCompDay();
        if(compDay)selected.splice(selected.findIndex(x=>x.date===compDay.date),1);
        if(selected.length<targetDays)selected.push(sunday);
      }
    }
    // Se una domenica è stata scelta, il compensativo deve restare libero.
    if(sunday&&selected.some(x=>x.date===sunday.date)&&!compDay){
      const possible=weekdays.filter(x=>compOptions.includes(x.d)&&!selected.some(y=>y.date===x.date));
      compDay=possible[0]||null;
      if(compDay)skipped.comp++;
    }
    selected.forEach(x=>setPresence(e,x.date,x.store));
  }
  const generated=Object.keys(chosen).length;
  const autoInfo=document.getElementById('genModeInfo');
  if(autoInfo){
    autoInfo.innerHTML='<b>Autogenerazione completata</b><div class="muted section">'+generated+' presenze proposte. Il PWA ha escluso riposi fissi, assenze approvate, domeniche non consentite e negozi chiusi; quando viene prevista una domenica utilizza, se configurato, un riposo compensativo.</div><div class="muted">Controlla la griglia e poi premi <b>Genera settimana</b>.</div>';
  }
}

function storeNameOf(id){const s=STORES.find(x=>x[0]===id);return s?s[1]:id||'—'}
function generatePresenceWeek(week,stores,dates,replace,onlyStore){
  const selections=[];const conflicts=[];const closed=[];const invalid=[];
  const allWorkers=db.employees.filter(e=>e.stato==='attivo'&&e.inTurni!==false);
  for(const e of allWorkers)for(const date of dates){const el=document.getElementById('pr_'+e.id+'_'+date);if(!el||!el.value)continue;const store=el.value;if(!eligibleForStore(e,store)){invalid.push(e.nome+' '+e.cognome+' · '+date+' (mobilità non autorizzata)');continue}const h=storeDay(store,date);if(h&&h.closed){closed.push(storeNameOf(store)+' · '+date+' · '+e.nome+' '+e.cognome);continue}if(approvedAbsence(e.id,date)){invalid.push(e.nome+' '+e.cognome+' · '+date+' (assenza approvata)');continue}const duplicate=selections.find(x=>String(x.emp)===String(e.id)&&x.date===date);if(duplicate){conflicts.push(e.nome+' '+e.cognome+' · '+date+' (due negozi nella generazione)');continue}const existingOtherStore=db.shifts.find(x=>String(x.emp)===String(e.id)&&x.date===date&&x.type==='Turno'&&(!replace||onlyStore&&x.store!==onlyStore));if(existingOtherStore){conflicts.push(e.nome+' '+e.cognome+' · '+date+' (già assegnato a '+storeNameOf(existingOtherStore.store)+')');continue}selections.push({emp:e.id,date,store})}
  if(conflicts.length||invalid.length||closed.length){alert('Controlla le presenze prima di generare.\n'+(conflicts.length?'Conflitti: '+conflicts.join(', ')+'\n':'')+(invalid.length?'Non consentito: '+invalid.join(', ')+'\n':'')+(closed.length?'Negozio chiuso: '+closed.join(', '):''));return false}
  if(!selections.length){alert('Inserisci almeno una presenza in un punto vendita.');return false}
  const wantedWeek=shiftWeekKey(week);
  if(replace){db.shifts=db.shifts.filter(s=>!(dates.includes(s.date)&&s.type==='Turno'&&(!onlyStore||s.store===onlyStore)));}
  for(const p of selections){db.shifts.push({id:Date.now()+Math.floor(Math.random()*1000000),emp:p.emp,date:p.date,store:p.store,in:'',out:'',breakStart:'',breakEnd:'',type:'Turno',orarioDaDefinire:true,note:'Presenza inserita · orario da definire'});}
  for(const store of stores)weekStoreState(wantedWeek,store).status='bozza';
  audit('Turni','Generata settimana presenze '+wantedWeek+' · '+selections.length+' presenze');save();closeModal();render();alert('Presenze generate: '+selections.length+'. Gli orari sono da definire e saranno inseriti dal Direttore.');return true;
}
function generateWeek(){
  const week=shiftWeekKey(genWeek.value),onlyStore=genStore.value,dates=shiftWeekDates(week),mode=genMode.value;
  if(!db.shiftWeeks||typeof db.shiftWeeks!=='object')db.shiftWeeks={};
  let replace=!!genReplace.checked;
  const stores=onlyStore?[onlyStore]:shiftStores();
  const existingWeekShifts=db.shifts.filter(s=>dates.includes(s.date)&&(s.type==='Turno'||s.type==='Corso')&&(!onlyStore||s.store===onlyStore));
  if(existingWeekShifts.length&&!replace){
    if(!confirm('La settimana '+weekLabel(week)+' contiene già turni nel periodo selezionato. Vuoi sovrascriverli?'))return;
    replace=true;
  }
  if(mode==='presence'){generatePresenceWeek(week,stores,dates,replace,onlyStore);return;}

  // La generazione parte da zero nello scope scelto. Le eventuali ore già
  // presenti negli altri negozi restano però conteggiate nel monte ore del lavoratore.
  const doReplace=replace||existingWeekShifts.length>0;
  if(doReplace){
    db.shifts=db.shifts.filter(s=>{
      if(!dates.includes(s.date))return true;
      if(onlyStore)return s.store!==onlyStore;
      return false;
    });
    if(!onlyStore){
      for(const k of Object.keys(db.shiftWeeks[week]||{}))delete db.shiftWeeks[week][k];
    }else if(db.shiftWeeks[week])delete db.shiftWeeks[week][onlyStore];
  }
  if(!db.shiftWeeks[week])db.shiftWeeks[week]={};
  for(const store of stores)db.shiftWeeks[week][store]={status:'bozza'};

  const allWorkers=db.employees.filter(e=>e.stato==='attivo'&&e.inTurni!==false);
  const eligible=Object.fromEntries(stores.map(store=>[store,allWorkers.filter(e=>eligibleForStore(e,store))]));
  const targetOf=e=>Math.max(0,Number(e.ore)||40);

  const state=Object.fromEntries(allWorkers.map(e=>{
    const existing=db.shifts.filter(s=>String(s.emp)===String(e.id)&&dates.includes(s.date)&&s.type==='Turno');
    return [String(e.id),{
      assigned:existing.reduce((n,s)=>n+shiftHoursValue(s),0),
      days:new Set(existing.map(s=>s.date)),
      shifts:new Map(existing.map(s=>[s.date,s])),
      open:0,close:0,workDays:existing.length,
      compDay:null
    }];
  }));

  const uncovered=[];
  const warnings=[];
  let created=0;

  const dayNo=date=>{const j=new Date(date+'T12:00:00').getDay();return j===0?6:j-1};
  const hourMin=t=>timeMin(t||'00:00');
  const shiftStart=s=>hourMin(s?.in);
  const shiftEnd=s=>hourMin(s?.out);

  const approvedOrBlocked=(e,date)=>{
    const d=dayNo(date);
    if((e.riposiFissi||[]).includes(String(d)))return true;
    if(approvedAbsence(e.id,date))return true;
    if(d===6&&!sundayCanWork(e,date))return true;
    return false;
  };

  const hasAdjacentRest=e=>{
    const st=state[String(e.id)];
    return st.workDays<6;
  };

  const rest11Ok=(e,date,tm)=>{
    const st=state[String(e.id)];
    for(const [d,s] of st.shifts){
      if(d===date)continue;
      const delta=Math.round((new Date(d+'T12:00:00')-new Date(date+'T12:00:00'))/86400000);
      if(Math.abs(delta)!==1)continue;
      if(delta===-1 && s.out && tm.in){
        if(hourMin(tm.in)+1440-shiftEnd(s)<660)return false;
      }
      if(delta===1 && s.in && tm.out){
        if(hourMin(s.in)+1440-shiftEnd(tm)<660)return false;
      }
    }
    // Controlla anche il turno precedente/successivo già presente fuori dalla settimana.
    for(const s of db.shifts.filter(x=>String(x.emp)===String(e.id)&&x.type==='Turno')){
      const delta=Math.round((new Date(s.date+'T12:00:00')-new Date(date+'T12:00:00'))/86400000);
      if(Math.abs(delta)!==1)continue;
      if(delta===-1&&s.out&&tm.in&&hourMin(tm.in)+1440-shiftEnd(s)<660)return false;
      if(delta===1&&s.in&&tm.out&&hourMin(s.in)+1440-shiftEnd(tm)<660)return false;
    }
    return true;
  };

  const canWork=(e,date)=>{
    const st=state[String(e.id)];
    if(approvedOrBlocked(e,date))return false;
    if(st.days.has(date))return false;
    if(st.assigned>=targetOf(e)-0.01)return false;
    if(st.workDays>=6)return false;
    // Se ha lavorato la domenica, il riposo compensativo viene riservato
    // su uno dei giorni configurati.
    if(st.compDay===date)return false;
    return true;
  };

  const coverageFor=(store,date)=>{
    return db.shifts.filter(s=>s.store===store&&s.date===date&&s.type==='Turno');
  };

  const scoreWorker=(e,store,date,kind)=>{
    const st=state[String(e.id)],target=targetOf(e),remaining=Math.max(0,target-st.assigned);
    const cp=continuityProfile(e,store,week);
    const wd=new Date(date+'T12:00:00').getDay();
    let score=0;
    // Priorità forte alla copertura, poi distribuzione delle ore e continuità.
    score += (st.assigned/Math.max(1,target))*12;
    score += st.workDays*1.8;
    score += (kind==='open'?st.open:kind==='close'?st.close:0)*4;
    if(cp.profile.weekdays.has(wd))score-=4;
    if(cp.profile.starts.get(wd))score-=2;
    const sameStart=cp.profile.starts.get(wd);
    if(sameStart&&kind==='open'&&sameStart===(storeDay(store,date)?.open||''))score-=2;
    if(sameStart&&kind==='close'&&sameStart!==(storeDay(store,date)?.open||''))score-=1;
    const team=coverageFor(store,date);
    const cap=Math.max(1,Number(e.capacitaGenerale)||3);
    score += team.length/cap;
    score += Math.max(0,5-remaining)*0.15;
    score += historicalFitScore(e,store,date,kind);
    // Evita di usare sempre lo stesso lavoratore per aperture/chiusure.
    if(kind==='open')score+=st.open*2;
    if(kind==='close')score+=st.close*2;
    return score;
  };

  const addShift=(e,store,date,h,kind,forcedHours)=>{
    const st=state[String(e.id)];
    const remaining=Math.max(0,targetOf(e)-st.assigned);
    const wanted=Math.min(10,remaining,forcedHours==null?10:Math.max(0,forcedHours));
    if(wanted<=0.01)return false;
    const tm=generatedTimes(e,h,kind,wanted,date,store);
    if(!tm||tm.worked<=0)return false;
    if(!rest11Ok(e,date,tm))return false;
    const x={id:Date.now()+created+Math.floor(Math.random()*1000),emp:e.id,date,store,in:tm.in,out:tm.out,breakStart:tm.breakStart||'',breakEnd:tm.breakEnd||'',type:'Turno',note:'Generato automaticamente · copertura '+(kind==='open'?'apertura':kind==='close'?'chiusura':'negozio')+' · pausa da contratto'};
    db.shifts.push(x);created++;
    st.assigned+=tm.worked;st.days.add(date);st.shifts.set(date,x);st.workDays++;
    if(kind==='open')st.open++;
    if(kind==='close')st.close++;
    return true;
  };

  // 1) Calcola il fabbisogno giornaliero. Se apertura+chiusura superano
  // il minimo giornaliero, il fabbisogno minimo diventa la somma dei due.
  const requirements=[];
  for(const date of dates)for(const store of stores){
    const h=storeDay(store,date);
    if(!h||h.closed)continue;
    const minTotal=Math.max(0,Number(h.mtotal)||0);
    const minOpen=Math.max(0,Number(h.mopen)||0);
    const minClose=Math.max(0,Number(h.mclose)||0);
    const required=Math.max(minTotal,minOpen+minClose);
    requirements.push({date,store,h,minTotal,minOpen,minClose,required});
  }

  // 2) Prima copriamo i buchi strutturali del negozio. Ogni posto di
  // apertura/chiusura viene assegnato a un lavoratore diverso quando possibile.
  // Non si scelgono ancora le persone "per fare 40 ore": prima viene coperto il negozio.
  const assignRequirement=(r,kind)=>{
    const current=coverageFor(r.store,r.date);
    const needed=kind==='open'?r.minOpen:kind==='close'?r.minClose:Math.max(0,r.required-current.length);
    let done=0;
    while(done<needed){
      const candidates=eligible[r.store]
        .filter(e=>canWork(e,r.date))
        .filter(e=>!coverageFor(r.store,r.date).some(s=>String(s.emp)===String(e.id)))
        .map(e=>({e,score:scoreWorker(e,r.store,r.date,kind)}))
        .sort((a,b)=>a.score-b.score);
      let picked=null;
      for(const x of candidates){
        if(addShift(x.e,r.store,r.date,r.h,kind)){picked=x.e;break}
      }
      if(!picked)break;
      done++;
    }
    return done;
  };

  // Aperture e chiusure sono trattate come vincoli duri.
  for(const r of requirements){
    const openDone=assignRequirement(r,'open');
    if(openDone<r.minOpen)uncovered.push(r.store+' '+r.date+' apertura');
    const closeDone=assignRequirement(r,'close');
    if(closeDone<r.minClose)uncovered.push(r.store+' '+r.date+' chiusura');
    while(coverageFor(r.store,r.date).length<r.required){
      if(assignRequirement(r,'middle')<=0)break;
    }
    if(coverageFor(r.store,r.date).length<r.required)uncovered.push(r.store+' '+r.date+' personale minimo');
  }

  // 3) Completiamo le ore contrattuali. Il lavoratore viene messo dove
  // serve di più, mantenendo continuità con le settimane già approvate.
  // Non può fare due negozi nello stesso giorno.
  for(const e of allWorkers){
    const st=state[String(e.id)],target=targetOf(e);
    let guard=0;
    while(st.assigned<target-0.01&&guard++<80){
      const candidates=[];
      for(const date of dates){
        if(!canWork(e,date))continue;
        for(const store of stores){
          if(!eligibleForStore(e,store))continue;
          const h=storeDay(store,date);if(!h||h.closed)continue;
          const team=coverageFor(store,date);
          const req=requirements.find(r=>r.store===store&&r.date===date);
          const shortage=req?Math.max(0,req.required-team.length):0;
          const closeMissing=req&&req.minClose&&!team.some(s=>s.out===h.close);
          const openMissing=req&&req.minOpen&&!team.some(s=>s.in===h.open);
          let kind=closeMissing?'close':openMissing?'open':'middle';
          const cp=continuityProfile(e,store,week);
          const wd=new Date(date+'T12:00:00').getDay();
          let score=shortage*30+(closeMissing?20:0)+(openMissing?10:0);
          score-=cp.profile.weekdays.has(wd)?8:0;
          score-=cp.profile.starts.get(wd)?3:0;
          score+=(team.length/Math.max(1,Number(e.capacitaGenerale)||3))*2;
          score+=(st.assigned/Math.max(1,target))*10;
          score+=st.workDays*1.5;
          // Preferisce distribuire il monte ore su 5-6 giornate, non creare
          // 4 ore casuali quando c'è ancora spazio per una giornata piena.
          const remaining=target-st.assigned;
          if(remaining>6&&kind!=='middle')score-=2;
          candidates.push({date,store,h,kind,score,remaining});
        }
      }
      candidates.sort((a,b)=>a.score-b.score||a.date.localeCompare(b.date));
      if(!candidates.length)break;
      let placed=false;
      for(const p of candidates){
        const maxDay=Math.min(10,p.remaining);
        if(addShift(e,p.store,p.date,p.h,p.kind,maxDay)){placed=true;break}
      }
      if(!placed)break;
    }
    const delta=Math.round((target-st.assigned)*100)/100;
    if(delta>0.01)warnings.push((e.nome||'')+' '+(e.cognome||'')+': mancano '+String(delta).replace('.',',')+' h');
  }

  // 4) Se una domenica è stata assegnata, riserviamo un vero riposo
  // compensativo tra i giorni configurati. Se il giorno scelto è già lavorato,
  // spostiamo quel turno su un altro giorno compatibile.

      (uncovered.length?'Coperture da verificare: '+uncovered.slice(0,10).join(', ')+(uncovered.length>10?' …':'')+'\n':'')+

        return '<td class="'+cellClass+'"'+clickable+'>'+inner+'</td>';
      }).join('');
      const mobility=e.mobilita||[],mobileTo=mobility.filter(s=>s!==e.negozio);return '<tr><td class="sp-contract">'+contract.toFixed(0)+'</td><td class="sp-note"><div class="sp-worker-name"><span class="sp-worker-main"><span class="sp-worker-icon">👤</span><b>'+esc(e.nome+' '+e.cognome)+'</b></span>'+(showTotals?'<span class="sp-worker-totals"><span>Ore <b>'+hours.toFixed(2).replace('.',',')+'</b></span><span>Saldo <b class="sp-balance '+(saldo<0?'neg':saldo>0?'pos':'')+'">'+(saldo>0?'+':'')+String(saldo).replace('.',',')+'</b></span></span>':'')+(mobileTo.includes(store)?'<span class="sp-mobility">↔ MOBILITÀ</span>':'')+'</div>'+(e.note?'<div class="sp-note-sub">'+esc(e.note)+'</div>':'')+'</td>'+dayCells+'</tr>';
    }).join('');
    const head=dates.map(date=>{
      const x=new Date(date+'T12:00:00');
      const wd=DAYS[x.getDay()===0?6:x.getDay()-1];
      return '<th class="sp-date"><b>'+wd.toLowerCase()+'</b><span>'+date.slice(8,10)+'/'+date.slice(5,7)+'</span><small>PV</small></th>';
    }).join('');
    return '<div class="shift-plan section"><div class="sp-title">'+esc(storeName.toUpperCase())+' <span>SETTIMANA N.'+weekNo+'</span></div><div class="tablewrap"><table class="sp-table"><thead><tr><th class="sp-h1">ORE SETTIMANALI A CONTRATTO</th><th class="sp-h2">LAVORATORE / NOTE / ORE / SALDO</th>'+head+'</tr></thead><tbody>'+(rows||'<tr><td colspan="'+(2+dates.length)+'" class="sp-empty">Nessun lavoratore/turno per questo punto vendita.</td></tr>')+'</tbody></table></div></div>';
  }).join('');
  return controls+blocks;
}
function board(){const now=todayDate();let list=db.board.filter(b=>(!b.exp||b.exp>=now)&&(b.target==='all'||b.target===user.negozio||b.target==='u:'+user.id||user.ruolo>=2));return '<div class="actions">'+(user.ruolo>=2?'<button class="btn" onclick="boardModal()">+ Nuova comunicazione</button>':'')+'</div>'+list.map(b=>'<div class="card section"><h3>'+esc(b.title)+'</h3><div style="white-space:pre-wrap">'+esc(b.body)+'</div><div class="muted section">'+new Date(b.at).toLocaleString('it-IT')+(b.exp?' · fino al '+b.exp:'')+'</div></div>').join('')||'<div class="card section">Nessuna comunicazione.</div>'}
function auditPage(){if(user.ruolo!==3)return '<div class="card">Accesso non disponibile.</div>';return '<div class="card"><h3>Audit log</h3><div class="tablewrap"><table class="table"><tr><th>Data</th><th>Utente</th><th>Azione</th><th>Dettaglio</th></tr>'+db.audit.map(a=>'<tr><td>'+new Date(a.at).toLocaleString('it-IT')+'</td><td>'+esc(a.name)+'</td><td>'+esc(a.action)+'</td><td>'+esc(a.detail)+'</td></tr>').join('')+'</table></div></div>'}
function exportCsv(kind){let rows=[];if(kind==='presenze'){rows=[['Data','Lavoratore','Negozio','Entrata','Uscita','Pausa','Ore'],...db.attendance.map(a=>[a.date,empName(a.emp),a.store,a.in,a.out,a.breakMin,workedHours(a)])]}else if(kind==='assenze'){rows=[['Lavoratore','Tipo','Dal','Al','Stato','Note'],...db.absences.map(a=>[empName(a.emp),a.tipo,a.da,a.a,a.stato,a.note||''])]}else{rows=[['Lavoratore','Corso','Categoria','Data','Scadenza','Stato'],...db.courses.map(c=>[empName(c.emp),c.titolo,c.categoria,c.data,c.scadenza,courseState(c)])]}const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='bplus-'+kind+'-'+todayDate()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);audit('Export','CSV '+kind);save()}
function printReport(){const old=document.body.innerHTML;const rows=db.attendance.map(a=>'<tr><td>'+a.date+'</td><td>'+empName(a.emp)+'</td><td>'+a.in+'</td><td>'+a.out+'</td><td>'+workedHours(a)+'</td></tr>').join('');document.body.innerHTML='<div style="font-family:Arial;padding:30px;color:#111"><h1>B+ Gestionale HR</h1><h2>Report presenze</h2><table border="1" cellpadding="6" cellspacing="0"><tr><th>Data</th><th>Lavoratore</th><th>Entrata</th><th>Uscita</th><th>Ore</th></tr>'+rows+'</table></div>';window.print();location.reload()}
function reports(){return '<div class="grid"><div class="card"><b>Presenze</b><div class="stat">'+db.attendance.length+'</div></div><div class="card"><b>Assenze</b><div class="stat">'+db.absences.length+'</div></div><div class="card"><b>Formazione</b><div class="stat">'+db.courses.length+'</div></div><div class="card"><b>Turni</b><div class="stat">'+db.shifts.length+'</div></div></div><div class="section card"><h3>Esportazioni</h3><div class="actions"><button class="btn" onclick="exportCsv(\'presenze\')">Presenze CSV / Excel</button><button class="btn secondary" onclick="exportCsv(\'assenze\')">Assenze CSV / Excel</button><button class="btn secondary" onclick="exportCsv(\'corsi\')">Corsi CSV / Excel</button><button class="btn green" onclick="printReport()">Stampa / PDF</button></div></div>'}
function backupPage(){if(user.ruolo!==3)return '<div class="card">Accesso non disponibile.</div>';return '<div class="card"><h3>Backup e sincronizzazione</h3><p>Il gestionale salva i dati sul dispositivo. Puoi creare un backup completo e ripristinarlo su un altro dispositivo.</p><div class="actions"><button class="btn" onclick="downloadBackup()">Scarica backup</button><label class="btn secondary" style="display:inline-flex;align-items:center;cursor:pointer">Ripristina backup<input type="file" accept=".json,application/json" style="display:none" onchange="restoreBackup(this.files[0])"></label></div><p class="muted section">Il backup comprende turni, ferie/permessi, corsi, bacheca, calendario, notifiche e configurazione.</p></div>'}
function downloadBackup(){const payload={version:4,exportedAt:new Date().toISOString(),db};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='bplus-backup-'+todayDate()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500);audit('Backup','Esportazione completa');save()}
function restoreBackup(file){if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const x=JSON.parse(rd.result);if(!x.db||!x.version)throw Error();if(!confirm('Il ripristino sostituirà i dati presenti su questo dispositivo. Continuare?'))return;db=x.db;for(const k of Object.keys(defaults))if(!db[k])db[k]=defaults[k];audit('Backup','Ripristino completo');save();render();alert('Backup ripristinato.')}catch(e){alert('Backup non valido.')}};rd.readAsText(file)}
function calendar(){const now=new Date(),month=Number(window._calendarMonth??now.getMonth()),year=Number(window._calendarYear??now.getFullYear());const first=new Date(year,month,1),last=new Date(year,month+1,0),start=new Date(year,month,1-((first.getDay()+6)%7));const events=Array.isArray(db.calendarEvents)?db.calendarEvents:[];const days=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');const items=events.filter(x=>String(x.date||x.da||x.data||'').slice(0,10)===key);days.push('<button class="card" style="min-height:76px;padding:7px;text-align:left;'+(d.getMonth()!==month?'opacity:.4;':'')+'" onclick="calendarDay(\''+key+'\')"><b>'+d.getDate()+'</b>'+(items.length?'<div class="muted" style="font-size:11px;margin-top:5px">'+items.slice(0,2).map(x=>esc(x.title||x.titolo||x.nome||x.tipo||'Evento')).join('<br>')+'</div>':'')+'</button>')}const label=first.toLocaleDateString('it-IT',{month:'long',year:'numeric'});return '<div class="actions"><button class="btn secondary" onclick="calendarMove(-1)">‹</button><button class="btn" onclick="calendarToday()">Oggi</button><button class="btn secondary" onclick="calendarMove(1)">›</button><button class="btn green" onclick="calendarAdd()">+ Evento</button></div><div class="card section"><h3 style="text-transform:capitalize">'+esc(label)+'</h3><div class="grid" style="grid-template-columns:repeat(7,minmax(0,1fr));gap:5px">'+['Lun','Mar','Mer','Gio','Ven','Sab','Dom'].map(x=>'<div class="muted" style="text-align:center">'+x+'</div>').join('')+days.join('')+'</div></div><div class="card section"><h3>Eventi in calendario</h3>'+(events.length?events.slice().sort((a,b)=>String(a.date||a.da||a.data||'').localeCompare(String(b.date||b.da||b.data||''))).map((x,i)=>'<div class="section"><b>'+esc(x.title||x.titolo||x.nome||x.tipo||'Evento')+'</b><div class="muted">'+esc(x.date||x.da||x.data||'')+(x.store?' · '+esc(storeNameOf(x.store)): '')+'</div>'+(x.note?'<div>'+esc(x.note)+'</div>':'')+'</div>').join(''):'<div class="muted">Nessun evento salvato.</div>')+'</div>'}function calendarMove(delta){const d=new Date(Number(window._calendarYear??new Date().getFullYear()),Number(window._calendarMonth??new Date().getMonth())+delta,1);window._calendarMonth=d.getMonth();window._calendarYear=d.getFullYear();render()}function calendarToday(){window._calendarMonth=new Date().getMonth();window._calendarYear=new Date().getFullYear();render()}function calendarDay(date){const events=db.calendarEvents.filter(x=>String(x.date||x.da||x.data||'').slice(0,10)===date);alert(date+'\\n'+(events.length?events.map(x=>x.title||x.titolo||x.nome||x.tipo||'Evento').join('\\n'):'Nessun evento'));}function calendarAdd(){const title=prompt('Titolo evento:');if(!title||!title.trim())return;const date=prompt('Data evento (AAAA-MM-GG):',todayDate());if(!date||!/^\\d{4}-\\d{2}-\\d{2}$/.test(date))return alert('Data non valida');db.calendarEvents.push({id:Date.now(),title:title.trim(),date,note:'',createdAt:new Date().toISOString()});audit('Calendario HR','Creato evento '+title.trim()+' · '+date);save();render()}
function render(){let h=page==='dashboard'?dashboard():page==='employees'?employees():page==='shifts'?shifts():page==='history'?history():page==='calendar'?calendar():page==='absences'?absences():page==='stores'?stores():page==='courses'?courses():page==='board'?board():page==='reports'?reports():page==='notifications'?notifications():page==='audit'?auditPage():page==='backup'?backupPage():profile();view.innerHTML=h}buildNav();render();window.BPlusCloud.initialize({getDb:()=>db,setDb:state=>{db=state;localStorage.setItem(KEY,JSON.stringify(db))},render:()=>render()}).catch(err=>{const g=document.getElementById('bplusCloudGate');const m=document.getElementById('bplusCloudGateMessage');if(g)g.hidden=false;if(m)m.textContent='Connessione online non riuscita: '+(err.message||'errore imprevisto')+'. Premi Riprova.';if(window.BPlusCloud&&BPlusCloud.setConnectionStatus)BPlusCloud.setConnectionStatus('offline');console.error('B+ cloud initialization failed',err)});
</script></body></html>
